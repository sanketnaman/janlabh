<svg width="1440" height="600" viewBox="0 0 1440 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Saffron Wave Gradient -->
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FF9933" stop-opacity="0.05" />
    </linearGradient>

    <!-- Neutral Accent Wave Gradient -->
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Green Wave Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#138808" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#138808" stop-opacity="0.05" />
    </linearGradient>
    
    <!-- Central Navy Glow -->
    <radialGradient id="navyGlow" cx="50%" cy="0%" r="50%">
      <stop offset="0%" stop-color="#000080" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000080" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Central Navy Blue Subtle Radial Glow -->
  <rect width="1440" height="600" fill="url(#navyGlow)" />

  <!-- Saffron Fluid Waves -->
  <path d="M 400 0 C 700 80, 1000 20, 1440 180 V 0 H 400 Z" fill="url(#saffronGrad)" />
  <path d="M 600 0 C 850 120, 1150 40, 1440 260 V 0 H 600 Z" fill="#FF9933" fill-opacity="0.08" />

  <!-- Middle Neutral Accent Wave -->
  <path d="M 0 220 C 350 140, 750 320, 1440 160 V 280 C 850 380, 300 220, 0 350 Z" fill="url(#whiteGrad)" />

  <!-- Green Fluid Waves -->
  <path d="M 0 320 C 450 260, 800 480, 1200 600 H 0 V 320 Z" fill="url(#greenGrad)" />
  <path d="M 0 220 C 300 180, 650 380, 950 600 H 0 V 220 Z" fill="#138808" fill-opacity="0.08" />
</svg>