<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E17" />
      <stop offset="40%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Tricolor Saffron Glow -->
    <radialGradient id="saffronGlow" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#FF9933" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#FF9933" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#FF9933" stop-opacity="0" />
    </radialGradient>

    <!-- Tricolor Green Glow -->
    <radialGradient id="greenGlow" cx="85%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#138808" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#138808" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#138808" stop-opacity="0" />
    </radialGradient>

    <!-- Ashoka Navy Accent Glow -->
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Grid Layer -->
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Ambient Glows -->
  <rect width="1200" height="630" fill="url(#saffronGlow)" />
  <rect width="1200" height="630" fill="url(#greenGlow)" />
  <rect width="1200" height="630" fill="url(#blueGlow)" />

  <!-- Abstract Waves -->
  <path d="M-100 450 C 300 350, 600 580, 1300 400 L 1300 650 L -100 650 Z" fill="#138808" fill-opacity="0.08" />
  <path d="M-100 150 C 400 80, 800 240, 1300 100 L 1300 -50 L -100 -50 Z" fill="#FF9933" fill-opacity="0.07" />

  <!-- Center Decorative Frame -->
  <rect x="180" y="95" width="840" height="440" rx="24" fill="#0F172A" fill-opacity="0.65" stroke="#334155" stroke-width="1.5" stroke-dasharray="8 6" />

  <!-- Camera / Image Icon Symbol in Center -->
  <g transform="translate(552, 175)">
    <!-- Squircle icon container -->
    <rect x="0" y="0" width="96" height="96" rx="24" fill="#1E293B" stroke="#475569" stroke-width="2" />
    <!-- Camera vector -->
    <path d="M 32 38 L 40 38 L 43 33 L 53 33 L 56 38 L 64 38 C 67.3 38 70 40.7 70 44 L 70 64 C 70 67.3 67.3 70 64 70 L 32 70 C 28.7 70 26 67.3 26 64 L 26 44 C 26 40.7 28.7 38 32 38 Z" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linejoin="round" />
    <circle cx="48" cy="54" r="8" fill="none" stroke="#F59E0B" stroke-width="2.5" />
    <circle cx="61" cy="44" r="1.8" fill="#F59E0B" />
  </g>

  <!-- Typography -->
  <!-- Top Badge -->
  <g transform="translate(600, 310)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#1E293B" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="1" />
    <text text-anchor="middle" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#F59E0B" letter-spacing="1.5">OFFICIAL SCHEME BANNER</text>
  </g>

  <!-- Title Heading -->
  <text x="600" y="370" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    सरकारी योजना फोटो बैनर
  </text>
  <text x="600" y="405" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#94A3B8">
    Scheme Hero Image Placeholder
  </text>

  <!-- Dimension Indicator Pill -->
  <g transform="translate(600, 465)">
    <rect x="-170" y="-16" width="340" height="32" rx="16" fill="#0B132B" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1" />
    <text text-anchor="middle" y="5" font-family="system-ui, -apple-system, monospace" font-size="13" font-weight="600" fill="#38BDF8">
      📐 Recommended Size: 1200 × 630 px (16:9 / 1.91:1)
    </text>
  </g>

  <!-- Bottom Brand Watermark -->
  <text x="600" y="590" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#64748B" letter-spacing="1">
    JANLABH.IN · CITIZEN WELFARE GUIDANCE PORTAL
  </text>
</svg>
