<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080F1D" />
      <stop offset="50%" stop-color="#0D1B2A" />
      <stop offset="100%" stop-color="#1B263B" />
    </linearGradient>

    <!-- Tricolor Saffron Glow -->
    <radialGradient id="saffronGlow" cx="15%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#FF9933" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#FF9933" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FF9933" stop-opacity="0" />
    </radialGradient>

    <!-- Tricolor Green Glow -->
    <radialGradient id="greenGlow" cx="85%" cy="85%" r="65%">
      <stop offset="0%" stop-color="#138808" stop-opacity="0.30" />
      <stop offset="50%" stop-color="#138808" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#138808" stop-opacity="0" />
    </radialGradient>

    <!-- Golden Highlight Gradient -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Saffron-White-Green Gradient Bar -->
    <linearGradient id="tricolorBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="48%" stop-color="#FFFFFF" />
      <stop offset="52%" stop-color="#000080" />
      <stop offset="56%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#138808" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" />
    </pattern>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#saffronGlow)" />
  <rect width="1200" height="630" fill="url(#greenGlow)" />

  <!-- Top Decorative Tricolor Accent Stripe -->
  <rect x="0" y="0" width="1200" height="7" fill="url(#tricolorBar)" />

  <!-- JanLabh Portal Header Badge -->
  <g transform="translate(80, 56)">
    <rect width="180" height="38" rx="19" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <circle cx="20" cy="19" r="6" fill="#10B981" />
    <text x="36" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#E2E8F0" letter-spacing="1">JANLABH.IN</text>
  </g>

  <!-- Central Government Badge -->
  <g transform="translate(275, 56)">
    <rect width="270" height="38" rx="19" fill="#FF9933" fill-opacity="0.15" stroke="#FF9933" stroke-opacity="0.45" stroke-width="1.5" />
    <text x="20" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FDBA74" letter-spacing="0.5">🇮🇳 CENTRAL FLAGSHIP SCHEME</text>
  </g>

  <!-- 100 Days Guaranteed Work Badge -->
  <g transform="translate(560, 56)">
    <rect width="240" height="38" rx="19" fill="#138808" fill-opacity="0.18" stroke="#138808" stroke-opacity="0.45" stroke-width="1.5" />
    <text x="18" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#86EFAC">✓ 100 DAYS GUARANTEE</text>
  </g>

  <!-- Left Side: Main Typography -->
  <g transform="translate(80, 145)">
    <!-- Sub-heading / Pre-title -->
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#94A3B8" letter-spacing="2">
      MINISTRY OF RURAL DEVELOPMENT • GOVT. OF INDIA
    </text>

    <!-- Main Title English -->
    <text x="0" y="65" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" fill="#FFFFFF" letter-spacing="-1">
      MGNREGA Job Card
    </text>

    <!-- Main Title Hindi / Action Tag -->
    <text x="0" y="125" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="url(#goldText)">
      मनरेगा जॉब कार्ड लिस्ट &amp; ऑनलाइन स्टेटस 2026
    </text>

    <!-- Catchy Description -->
    <text x="0" y="172" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#CBD5E1">
      100 Days Legal Work Guarantee • Muster Roll • ABPS DBT Payment • State-wise Wage Rates
    </text>

    <!-- 4 Feature Pills -->
    <g transform="translate(0, 215)">
      <!-- Pill 1: Daily Wage -->
      <g>
        <rect width="180" height="48" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2" />
        <text x="16" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">DAILY WAGES 2026</text>
        <text x="16" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#38BDF8">₹234 – ₹374 / Day</text>
      </g>

      <!-- Pill 2: Online List -->
      <g transform="translate(195, 0)">
        <rect width="180" height="48" rx="12" fill="#1E293B" stroke="#34D399" stroke-width="1.2" />
        <text x="16" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">VILLAGE-WISE LIST</text>
        <text x="16" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#34D399">Check Online PDF</text>
      </g>

      <!-- Pill 3: Direct DBT -->
      <g transform="translate(390, 0)">
        <rect width="180" height="48" rx="12" fill="#1E293B" stroke="#FBBF24" stroke-width="1.2" />
        <text x="16" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">PAYMENT TRACKING</text>
        <text x="16" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#FBBF24">ABPS DBT Direct</text>
      </g>
    </g>
  </g>

  <!-- Right Side: Graphic Card Illustration -->
  <g transform="translate(770, 135)" filter="url(#cardShadow)">
    <!-- Back Glow Card -->
    <rect width="350" height="420" rx="24" fill="#0F172A" stroke="#334155" stroke-width="2" />

    <!-- Top Badge in Card -->
    <rect x="25" y="25" width="300" height="70" rx="14" fill="#1E293B" />
    <circle cx="60" cy="60" r="22" fill="#FF9933" fill-opacity="0.2" />
    <!-- Emblematical Checkmark -->
    <path d="M52 60 L 58 66 L 70 54" fill="none" stroke="#FF9933" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="95" y="52" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">NREGA JOB CARD</text>
    <text x="95" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#10B981">● ACTIVE &amp; VERIFIED</text>

    <!-- Card Body Items -->
    <g transform="translate(25, 115)">
      <!-- Item 1 -->
      <rect width="300" height="58" rx="10" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
      <text x="16" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">LEGAL ENTITLEMENT</text>
      <text x="16" y="44" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">100 Days Wage Guarantee</text>

      <!-- Item 2 -->
      <g transform="translate(0, 70)">
        <rect width="300" height="58" rx="10" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
        <text x="16" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">UNEMPLOYMENT ALLOWANCE</text>
        <text x="16" y="44" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#F59E0B">Paid if work not given in 15d</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 140)">
        <rect width="300" height="58" rx="10" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
        <text x="16" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">OFFICIAL PORTAL</text>
        <text x="16" y="44" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#38BDF8">nrega.nic.in / VB-GRAM-G</text>
      </g>

      <!-- Bottom Button Mockup -->
      <g transform="translate(0, 212)">
        <rect width="300" height="50" rx="12" fill="url(#tricolorBar)" />
        <text x="60" y="31" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#090E17" letter-spacing="0.5">CHECK LIST &amp; STATUS ONLINE</text>
      </g>
    </g>
  </g>

  <!-- Bottom Bar with JanLabh Trust Watermark -->
  <g transform="translate(80, 575)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#64748B">
      JanLabh.in • Independent Public Welfare Directory &amp; Eligibility Calculator • Updated for 2026
    </text>
  </g>
</svg>